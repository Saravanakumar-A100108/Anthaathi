<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anthaathi-Where It Begins | LPU Tamizhans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #f5a623;
    --gold-light: #ffcf6b;
    --cream: #f2ede1;
    --bg: #000000;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    font-family: 'Poppins', sans-serif;
    color: #fff;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }

  .poster {
    width: 100%;
    max-width: 620px;
    background: radial-gradient(ellipse at 50% 38%, #1a1206 0%, #000000 62%);
    border-radius: 6px;
    overflow: hidden;
    text-align: center;
    padding: 34px 28px 0 28px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
  }

  .logo {
    width: 118px;
    height: 118px;
    border-radius: 50%;
    object-fit: none;
    object-position: center 46%;
    margin: 0 auto 18px auto;
    display: block;
    vertical-align: middle;
  }

  .brand {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: #fdfdfd;
  }

  .presents {
    font-family: 'Dancing Script', cursive;
    font-size: 24px;
    font-weight: 600;
    color: #f0f0f0;
    margin-top: 4px;
    margin-bottom: 8px;
  }

  .callig {
    width: 100%;
    max-width: 480px;
    height: auto;
    margin: 6px auto 4px auto;
    display: block;
  }

  .meta-row {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 32px;
    margin-top: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(245,166,35,0.35);
  }

  .meta-item { flex: 1; max-width: 220px; }

  .meta-divider {
    width: 1px;
    background: rgba(255,255,255,0.25);
  }

  .meta-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .meta-value {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.3px;
  }

  .venue {
    padding: 14px 0 18px 0;
  }

  .venue .meta-label { margin-bottom: 6px; }

  .venue-value {
    font-size: 15px;
    font-weight: 700;
    color: hwb(195 95% 4%);
    letter-spacing: 0.3px;
  }

  .food-note {
    color: #1a1200;
    background: linear-gradient(180deg, #ffe08a 0%, #f5b735 100%);
    border: 1px solid rgba(255, 224, 138, 0.8);
    border-radius: 5px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.2px;
    line-height: 1.35;
    margin: 0 0 12px 0;
    padding: 9px 8px;
    box-shadow: 0 4px 14px rgba(245, 166, 35, 0.2);
  }

  .highlights {
    background: linear-gradient(180deg, #efe9da 0%, #cfc7b3 100%);
    color: #1a1a1a;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.4px;
    padding: 14px 12px;
    margin: 0 -28px;
  }

  .bottom {
    padding: 22px 12px 30px 12px;
  }

  .fewseats {
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    font-style: italic;
    font-size: 15px;
    color: #f4d9a0;
    letter-spacing: 0.2px;
    margin-bottom: 20px;
  }

  .ticket-btn {
    display: inline-block;
    background: linear-gradient(180deg, #ffc94d 0%, #f5a623 100%);
    color: #1a1200;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.4px;
    padding: 14px 48px;
    border-radius: 6px;
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(245,166,35,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .ticket-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(245,166,35,0.5);
  }

  .ticket-btn:active {
    transform: translateY(0);
  }

  @media (max-width: 420px) {
    body { padding: 0; }
    .poster {
      min-height: 100svh;
      border-radius: 0;
      padding: 16px 18px 0 18px;
    }
    .logo {
      width: 82px;
      height: 82px;
      margin-bottom: 8px;
    }
    .brand { font-size: 21px; }
    .presents {
      font-size: 19px;
      margin-top: 1px;
      margin-bottom: 3px;
    }
    .callig {
      max-height: 112px;
      margin: 2px auto;
      object-fit: contain;
    }
    .meta-row {
      gap: 16px;
      margin-top: 8px;
      padding-bottom: 9px;
    }
    .meta-label { font-size: 9px; }
    .meta-value, .venue-value { font-size: 12px; }
    .venue { padding: 8px 0 9px 0; }
    .food-note { font-size: 12px; margin-bottom: 8px; padding: 7px 6px; }
    .highlights { font-size: 11px; padding: 9px 8px; margin: 0 -18px; }
    .bottom { padding: 12px 6px 16px 6px; }
    .fewseats { font-size: 12px; margin-bottom: 10px; }
    .ticket-btn { font-size: 14px; padding: 10px 34px; }
  }
</style>
</head>
